services:
  postgres:
    image: postgres:16-alpine
    container_name: retrovault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retrovault_db}
      POSTGRES_USER: ${POSTGRES_USER:-retrovault_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPasswordInProd1995!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrovault_admin -d retrovault_db || pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: retrovault-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://retrovault_admin:ChangeThisStrongPasswordInProd1995!@postgres:5432/retrovault_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - BACKUP_REPOSITORY_PATH=/backup/repository
      - CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - backup_repository_data:/backup/repository
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  postgres_data:
    driver: local
  backup_repository_data:
    driver: local

